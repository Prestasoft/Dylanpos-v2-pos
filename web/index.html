<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema POS Victor Guzman Fotografía">

  <!-- Cache Control - Forzar actualización -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Victor Guzman POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Victor Guzman POS v2.1.578</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Estilos para el indicador de versión - OCULTO (la versión se muestra en el footer) */
    #version-indicator {
      display: none !important;
    }
    /* Splash de actualización */
    #update-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      flex-direction: column;
    }
    #update-splash.show {
      display: flex;
    }
    #update-splash h2 {
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin-bottom: 20px;
    }
    #update-splash .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #update-splash p {
      color: rgba(255,255,255,0.7);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Indicador de versión -->
  <div id="version-indicator">
    <span class="dot"></span>
    <span id="version-text">v2.1.578</span>
  </div>

  <!-- Splash de actualización -->
  <div id="update-splash">
    <div class="spinner"></div>
    <h2>Actualizando aplicación...</h2>
    <p>Por favor espere mientras se descarga la nueva versión</p>
  </div>

  <script>
    // ============================================
    // SISTEMA DE CONTROL DE VERSIONES v2.1.578
    // FUERZA LIMPIEZA TOTAL SI HAY VERSIÓN VIEJA
    // ============================================
    const REQUIRED_VERSION = '2.1.578';
    const CACHE_KEY = 'app_cache_version';
    const UPDATE_CHECK_KEY = 'last_update_check';
    var SERVER_VERSION = null;

    // VERIFICACIÓN INMEDIATA - Limpiar si hay versión vieja
    (function() {
      var storedVersion = localStorage.getItem('app_version') || localStorage.getItem(CACHE_KEY);
      var isOldVersion = storedVersion && !storedVersion.startsWith(REQUIRED_VERSION);
      var urlParams = new URLSearchParams(window.location.search);
      var justCleared = urlParams.get('cleared');

      if (isOldVersion && !justCleared) {
        console.log('%c🚨 VERSIÓN VIEJA DETECTADA: ' + storedVersion + ' → Limpiando TODO...', 'color: #ef4444; font-weight: bold; font-size: 16px');

        // Limpiar TODO el localStorage
        localStorage.clear();
        sessionStorage.clear();

        // Limpiar caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }

        // Desregistrar service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) { registration.unregister(); });
          });
        }

        // Guardar la nueva versión
        localStorage.setItem('app_version', REQUIRED_VERSION);
        localStorage.setItem(CACHE_KEY, REQUIRED_VERSION + '_' + Date.now());

        // Recargar con parámetro para evitar bucle
        setTimeout(function() {
          window.location.href = window.location.origin + window.location.pathname + '?cleared=1&v=' + Date.now();
        }, 500);
        return;
      }

      // Si no hay versión guardada, guardarla
      if (!storedVersion) {
        localStorage.setItem('app_version', REQUIRED_VERSION);
        localStorage.setItem(CACHE_KEY, REQUIRED_VERSION + '_' + Date.now());
      }
    })();

    // Función para mostrar el indicador de versión
    function showVersionIndicator(version) {
      setTimeout(function() {
        var indicator = document.getElementById('version-indicator');
        if (indicator) {
          indicator.classList.add('show');
          document.getElementById('version-text').textContent = 'v' + (version || '?.?.?');
        }
      }, 1000);
    }

    // Funciones para actualización de la aplicación
    window.clearAppCache = async function() {
      console.log('%c🗑️ Limpiando caché de la aplicación...', 'color: #f59e0b');

      // Limpiar localStorage (excepto datos importantes)
      var keysToKeep = ['firebase_token', 'user_preferences', UPDATE_CHECK_KEY, 'app_version', 'app_cache_version', 'update_clicked', 'update_clicked_version', 'update_timestamp'];
      var allKeys = Object.keys(localStorage);
      allKeys.forEach(function(key) {
        if (!keysToKeep.includes(key)) {
          localStorage.removeItem(key);
        }
      });

      // Limpiar sessionStorage
      sessionStorage.clear();

      // Limpiar cache del service worker
      if ('caches' in window) {
        var names = await caches.keys();
        await Promise.all(names.map(function(name) {
          console.log('%c  Eliminando caché: ' + name, 'color: #f59e0b');
          return caches.delete(name);
        }));
      }

      // Desregistrar service workers
      if ('serviceWorker' in navigator) {
        var registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(function(registration) {
          console.log('%c  Desregistrando Service Worker', 'color: #f59e0b');
          return registration.unregister();
        }));
      }

      console.log('%c✅ Caché limpiado correctamente', 'color: #22c55e');
    };

    window.reloadApp = async function(forceReload) {
      var splash = document.getElementById('update-splash');
      if (splash) splash.classList.add('show');

      await window.clearAppCache();

      setTimeout(function() {
        // Forzar recarga completa desde el servidor
        window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
      }, 500);
    };

    // Verificación de versión consultando el servidor
    async function checkServerVersion() {
      try {
        // Evitar bucle infinito - verificar si ya estamos en proceso de actualización
        var urlParams = new URLSearchParams(window.location.search);
        var isReloading = urlParams.get('v');

        console.log('%c🔍 Consultando versión del servidor...', 'color: #3b82f6');

        // Fetch con cache-busting para obtener la versión real del servidor
        var response = await fetch('/app-version.json?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });

        if (!response.ok) {
          throw new Error('No se pudo obtener app-version.json');
        }

        var serverData = await response.json();
        SERVER_VERSION = serverData.version;
        var serverBuild = serverData.build;
        var serverKey = SERVER_VERSION + '_' + serverBuild;

        // Mostrar en consola
        console.log('%c═══════════════════════════════════════════════', 'color: #8b5cf6; font-weight: bold');
        console.log('%c   Victor Guzman POS - Sistema de Reservas', 'color: #8b5cf6; font-size: 14px; font-weight: bold');
        console.log('%c   Versión servidor: ' + SERVER_VERSION + ' | Build: ' + serverBuild, 'color: #22c55e; font-weight: bold');
        console.log('%c═══════════════════════════════════════════════', 'color: #8b5cf6; font-weight: bold');

        // Obtener versión almacenada en el navegador
        var storedVersion = localStorage.getItem(CACHE_KEY);

        console.log('%c  Versión en navegador: ' + (storedVersion || 'ninguna'), 'color: #6b7280');
        console.log('%c  Versión en servidor: ' + serverKey, 'color: #6b7280');

        // Si las versiones son diferentes y no estamos ya recargando
        if (storedVersion !== serverKey) {
          console.log('%c🔄 ¡NUEVA VERSIÓN DETECTADA! Actualizando...', 'color: #f59e0b; font-weight: bold; font-size: 14px');

          // Si ya tenemos una versión anterior (no es primera visita)
          if (storedVersion && !isReloading) {
            // Mostrar splash de actualización
            var splash = document.getElementById('update-splash');
            if (splash) {
              splash.classList.add('show');
              var updateText = splash.querySelector('p');
              if (updateText) {
                updateText.textContent = 'Actualizando de ' + storedVersion.split('_')[0] + ' a ' + SERVER_VERSION;
              }
            }

            // Limpiar caché y recargar
            await window.clearAppCache();

            // Guardar nueva versión ANTES de recargar
            localStorage.setItem(CACHE_KEY, serverKey);
            localStorage.setItem('app_version', SERVER_VERSION);

            // Esperar un momento y recargar
            setTimeout(function() {
              window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
            }, 1000);
            return;
          } else {
            // Primera visita o ya recargamos - guardar versión
            localStorage.setItem(CACHE_KEY, serverKey);
            localStorage.setItem('app_version', SERVER_VERSION);
            console.log('%c✅ Versión guardada: ' + SERVER_VERSION, 'color: #22c55e; font-weight: bold');
          }
        } else {
          console.log('%c✅ Aplicación actualizada: ' + SERVER_VERSION, 'color: #22c55e');
        }

        // Mostrar indicador de versión
        showVersionIndicator(SERVER_VERSION);

      } catch (error) {
        console.error('%c⚠️ Error verificando versión:', 'color: #ef4444', error);
        // Mostrar versión almacenada o desconocida
        var fallbackVersion = localStorage.getItem('app_version') || '?.?.?';
        showVersionIndicator(fallbackVersion);
      }
    }

    // Ejecutar verificación al cargar
    checkServerVersion();

    // Registro del Service Worker de Firebase
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(function(registration) {
          console.log('%c📱 Service Worker registrado', 'color: #22c55e');
        }).catch(function(err) {
          console.log('%c⚠️ Error al registrar Service Worker:', 'color: #ef4444', err);
        });
    }

    // ============================================
    // DETECCIÓN Y RECUPERACIÓN DE ERRORES DE MEMORIA
    // ============================================
    var memoryErrorDetected = false;
    var autoRecoveryAttempted = sessionStorage.getItem('memory_recovery_attempted');

    // Función común para manejar errores de memoria
    async function handleMemoryError(errorMessage) {
      if (memoryErrorDetected || autoRecoveryAttempted) return false;

      // Verificar si es un error de memoria
      if (!errorMessage || !(
          errorMessage.includes('Array buffer allocation failed') ||
          errorMessage.includes('Out of memory') ||
          errorMessage.includes('allocation failed')
      )) {
        return false;
      }

      memoryErrorDetected = true;
      console.log('%c🚨 ERROR DE MEMORIA DETECTADO - Iniciando limpieza automática...', 'color: #ef4444; font-weight: bold; font-size: 16px');

      // Mostrar splash de recuperación
      var splash = document.getElementById('update-splash');
      if (splash) {
        splash.classList.add('show');
        var title = splash.querySelector('h2');
        var text = splash.querySelector('p');
        if (title) title.textContent = 'Recuperando aplicación...';
        if (text) text.textContent = 'El navegador se quedó sin memoria. Limpiando caché automáticamente...';
      }

      // Marcar que intentamos recuperación para evitar bucle
      sessionStorage.setItem('memory_recovery_attempted', 'true');

      // Limpiar TODO
      localStorage.clear();

      // Limpiar caches del service worker
      if ('caches' in window) {
        try {
          var names = await caches.keys();
          await Promise.all(names.map(function(name) { return caches.delete(name); }));
        } catch(e) {}
      }

      // Desregistrar service workers
      if ('serviceWorker' in navigator) {
        try {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function(r) { return r.unregister(); }));
        } catch(e) {}
      }

      // Recargar después de limpiar
      setTimeout(function() {
        window.location.href = window.location.origin + window.location.pathname + '?recovered=1&v=' + Date.now();
      }, 1500);

      return true;
    }

    // Listener para errores síncronos
    window.addEventListener('error', async function(event) {
      await handleMemoryError(event.message);
    });

    // Listener para errores de Promises (async/await) - CRÍTICO para capturar errores de fuentes
    window.addEventListener('unhandledrejection', async function(event) {
      var errorMessage = '';
      if (event.reason) {
        if (typeof event.reason === 'string') {
          errorMessage = event.reason;
        } else if (event.reason.message) {
          errorMessage = event.reason.message;
        } else if (event.reason.toString) {
          errorMessage = event.reason.toString();
        }
      }
      await handleMemoryError(errorMessage);
    });

    // Limpiar flag de recuperación si cargó exitosamente
    window.addEventListener('load', function() {
      setTimeout(function() {
        sessionStorage.removeItem('memory_recovery_attempted');
      }, 5000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
